schema_version: 1

context:
  name: de-tagesschau
  version: "0.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 1744af05d35b7eded4e9a1f638a42305b5e7b7a55520f6fe863df121f4a52b25

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3 >=1.25.3

tests:
  - python:
      imports:
        - deutschland.tagesschau
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Tagesschau API
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/bundesAPI/tagesschau-api

extra:
  recipe-maintainers:
    - jan-janssen
